[project]
name = "fly-in"
version = "0.1.0"
description = "A grafs and algorithm understanding projects using drones and bases"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
    "pygame-ce>=2.5",
]

[dependency-groups]
dev = [
    "flake8>=7",
    "flake8-pyproject>=1.2",
    "mypy>=1.10",
    "pytest>=8",
]

[tool.flake8]
exclude = [".venv", "__pycache__", ".mypy_cache", "maps"]

[tool.mypy]
python_version = "3.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv]
package = false